services:
  - type: web
    name: mahesh-bot
    runtime: python
    plan: free
    buildCommand: "echo no build needed"
    startCommand: "python bot.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: BOT_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
